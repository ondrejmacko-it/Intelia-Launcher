<title>Intelia Veil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<style>
/* Layout: phone at real dp scale (360 × 797) on the left, scenes + controls + notes on the right; stacks under 900 px. */
:root{
  --page:#ECEEF1; --page-fg:#16191E; --page-dim:#59616C; --page-line:#D2D7DD; --page-raise:#F8F9FA; --page-acc:#3F6E9C;
  --f-ui:"Roboto Flex",Roboto,system-ui,sans-serif; --f-mono:"Roboto Mono",ui-monospace,monospace; --f-ink:"Newsreader",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0E1013;--page-fg:#E6E9ED;--page-dim:#97A0AB;--page-line:#272C33;--page-raise:#16191D;--page-acc:#9DB8D6;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0E1013;--page-fg:#E6E9ED;--page-dim:#97A0AB;--page-line:#272C33;--page-raise:#16191D;--page-acc:#9DB8D6;color-scheme:dark}
html,body{background:var(--page);color:var(--page-fg)}
body{font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
header.top{max-width:1200px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline}
header.top h1{font-size:22px;font-weight:560;font-variation-settings:"wdth" 116;margin:0;letter-spacing:.3px}
header.top p{margin:0;color:var(--page-dim);font-size:14px;max-width:70ch;text-wrap:pretty}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;justify-content:center;position:sticky;top:12px}
@media (max-width:900px){.stage{position:static}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.group{display:flex;flex-direction:column;gap:7px}
.group h2{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--page-dim);margin:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--page-line);background:var(--page-raise);color:var(--page-fg);border-radius:8px;padding:6px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--page-acc);color:var(--page-acc);box-shadow:inset 0 0 0 1px var(--page-acc)}
.chips button:focus-visible{outline:2px solid var(--page-acc);outline-offset:2px}
.chips .n{font-family:var(--f-mono);font-size:11px;color:var(--page-dim);margin-right:5px}
.note{background:var(--page-raise);border:1px solid var(--page-line);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.55}
.note h3{margin:0 0 6px;font-size:15px;font-weight:600}
.note p{margin:6px 0 0}
.note ul{margin:6px 0 0;padding-left:18px}
.note code{font-family:var(--f-mono);font-size:12px}
.log{font-family:var(--f-mono);font-size:12px;color:var(--page-dim);display:flex;flex-direction:column;gap:3px;min-height:72px}
.log b{color:var(--page-fg);font-weight:500}

/* ───────── Phone ───────── */
.phone{--s:1;width:calc(360px*var(--s));height:calc(797px*var(--s));border-radius:calc(40px*var(--s));background:#000;box-shadow:0 0 0 calc(7px*var(--s)) #1a1b1e,0 20px 50px rgba(0,0,0,.28);flex:none;position:relative;overflow:hidden}
.scr{position:absolute;left:0;top:0;width:360px;height:797px;transform:scale(var(--s));transform-origin:0 0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  --k:1;
  --fg:#F2F4F6; --fg2:rgba(242,244,246,.64); --fg3:rgba(242,244,246,.38); --tsh:0 1px 2px rgba(0,0,0,.38);
  --acc:#A9C4E0; --acc-ink:#0D1620;
  --m-fill:linear-gradient(180deg,color-mix(in srgb,var(--acc) 9%,rgba(22,24,29,.70)),rgba(14,16,20,.78));
  --m-blur:none; --edge-hot:color-mix(in srgb,var(--acc) 78%,white); --edge-cold:rgba(255,255,255,.08);
  --inner:color-mix(in srgb,var(--acc) 15%,transparent); --m-shadow:0 18px 40px rgba(0,0,0,.34);
  --key:#24272c; --kb:#16181c; --line:rgba(255,255,255,.08); --home-blur:none;
  font-family:var(--f-ui);color:var(--fg);background:#000}
.scr[data-acc="sage"]{--acc:#B9CBA6;--acc-ink:#121a0c}
.scr[data-acc="amber"]{--acc:#E8C48F;--acc-ink:#21160a}
.scr[data-acc="lilac"]{--acc:#C6B8EC;--acc-ink:#191230}
.scr[data-mat="frosted"]{--m-fill:linear-gradient(180deg,color-mix(in srgb,var(--acc) 8%,rgba(28,30,36,.40)),rgba(18,20,24,.48));--m-blur:blur(22px) saturate(1.4);--home-blur:blur(9px)}
.scr[data-mat="solid"]{--m-fill:#16181C;--edge-hot:color-mix(in srgb,var(--acc) 60%,transparent);--edge-cold:rgba(255,255,255,.15);--inner:transparent}
/* Phone (3) truth: no cross-window blur, so Frosted only blurs Intelia's own layers and the panel stays a denser veil. */
.scr.p3[data-mat="frosted"]{--m-blur:none;--m-fill:linear-gradient(180deg,color-mix(in srgb,var(--acc) 9%,rgba(24,26,31,.66)),rgba(14,16,20,.74))}
.scr[data-wall="light"]{--fg:#14171B;--fg2:rgba(20,23,27,.64);--fg3:rgba(20,23,27,.40);--tsh:0 0 1px rgba(255,255,255,.5);
  --m-fill:linear-gradient(180deg,color-mix(in srgb,var(--acc) 9%,rgba(250,251,252,.74)),rgba(242,244,246,.82));
  --edge-hot:color-mix(in srgb,var(--acc) 85%,transparent);--edge-cold:rgba(255,255,255,.8);--m-shadow:0 16px 36px rgba(30,40,50,.18);
  --key:#ffffff;--kb:#dfe2e6;--line:rgba(0,0,0,.08)}
.scr[data-wall="light"][data-acc="frost"]{--acc:#3F6E9C;--acc-ink:#fff}
.scr[data-wall="light"][data-acc="sage"]{--acc:#4E6B39;--acc-ink:#fff}
.scr[data-wall="light"][data-acc="amber"]{--acc:#8A5A17;--acc-ink:#fff}
.scr[data-wall="light"][data-acc="lilac"]{--acc:#5E4D9A;--acc-ink:#fff}
.scr[data-wall="light"][data-mat="frosted"]{--m-fill:linear-gradient(180deg,color-mix(in srgb,var(--acc) 8%,rgba(250,251,252,.46)),rgba(244,246,248,.54))}
.scr.p3[data-wall="light"][data-mat="frosted"]{--m-fill:linear-gradient(180deg,color-mix(in srgb,var(--acc) 9%,rgba(250,251,252,.78)),rgba(242,244,246,.84))}
.scr[data-wall="light"][data-mat="solid"]{--m-fill:#F6F7F8;--edge-cold:rgba(0,0,0,.09)}
.scr.rm{--k:0}
.scr *{box-sizing:border-box}
.ab{position:absolute}

.wall{position:absolute;inset:0;transform:scale(1.07);transition:transform calc(320ms*var(--k)) cubic-bezier(.2,.8,.2,1),filter calc(320ms*var(--k));
  background:radial-gradient(80% 48% at 22% 28%,#3d4c66 0,transparent 70%),radial-gradient(70% 45% at 82% 74%,#5e4b3f 0,transparent 70%),radial-gradient(60% 40% at 58% 52%,#25313f 0,transparent 70%),#0f1115}
.scr[data-wall="light"] .wall{background:radial-gradient(90% 60% at 20% 18%,#fdfcf8 0,transparent 62%),radial-gradient(80% 60% at 85% 82%,#c4d3de 0,transparent 70%),#e6e8e4}
.scr[data-wall="color"] .wall{background:radial-gradient(70% 50% at 20% 25%,#d9765a 0,transparent 70%),radial-gradient(70% 50% at 86% 62%,#3c6bd6 0,transparent 70%),radial-gradient(60% 40% at 40% 92%,#2a9c84 0,transparent 70%),#1c1a28}
.scr.editing .wall{transform:scale(1);filter:brightness(.8)}
.scr[data-wall="light"].editing .wall{filter:brightness(.93)}

.status{left:0;right:0;top:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;pointer-events:none;z-index:60;text-shadow:var(--tsh)}
.status .si{display:flex;gap:6px;align-items:center}
.status .si i{display:block;width:14px;height:9px;border-radius:2px;border:1.4px solid currentColor;opacity:.9}
.cam{left:171.5px;top:13.5px;width:17px;height:17px;border-radius:50%;background:#050506;box-shadow:inset 0 0 0 2px #121316;z-index:70;pointer-events:none}
.pz{left:146px;top:0;width:68px;height:48px;z-index:65;border-radius:0 0 24px 24px}
.scr.editing .pz::after{content:"";position:absolute;left:21px;top:2px;width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px var(--fg3);transition:box-shadow .2s}
.scr.editing .pz.sel::after{box-shadow:0 0 0 1.5px var(--acc)}
.navbar{left:120px;width:120px;bottom:8px;height:4px;border-radius:2px;background:var(--fg2);z-index:60;pointer-events:none}
.scr.zones .pz{outline:1px dashed rgba(255,90,90,.85)}

/* Home layer */
.home{position:absolute;inset:0;transition:opacity calc(200ms*var(--k)),filter calc(220ms*var(--k)),transform calc(220ms*var(--k)) cubic-bezier(.2,.8,.2,1)}
.scr.searching .home{opacity:.22;filter:var(--home-blur);transform:scale(.985)}
.scr.arcing .home .it:not([data-id="lens"]){opacity:.35;transition:opacity calc(60ms*var(--k))}
.it{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;transition:left calc(220ms*var(--k)) cubic-bezier(.2,.9,.25,1.04),top calc(220ms*var(--k)) cubic-bezier(.2,.9,.25,1.04),opacity .18s}
.it.drag{transition:none;z-index:40}
.it.drag .ico{transform:scale(1.1);box-shadow:0 12px 26px rgba(0,0,0,.35)}
.it .lb{font-size:11.5px;font-weight:500;letter-spacing:.1px;color:var(--fg);text-shadow:var(--tsh);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.ico{display:grid;place-items:center;width:var(--sz);height:var(--sz);border-radius:50%;transition:transform .18s,box-shadow .18s;flex:none}
.ico svg{width:50%;height:50%}
.ico.sys{background:radial-gradient(120% 120% at 30% 18%,color-mix(in srgb,var(--c) 62%,white),var(--c) 58%);color:var(--gc)}
.ico.mono{color:var(--fg);filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.ico.mono svg{width:64%;height:64%}
.ico.veil{background:color-mix(in srgb,var(--fg) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 22%,transparent);color:var(--fg)}
.scr[data-wall="light"] .ico.mono{filter:none}
/* Edit marks: four hairline corner ticks, accent when selected */
.it::after{content:"";position:absolute;inset:-7px;pointer-events:none;--c:var(--fg2);--l:7px;opacity:0;transition:opacity calc(180ms*var(--k));
  background:linear-gradient(var(--c),var(--c)) top left/var(--l) 1px,linear-gradient(var(--c),var(--c)) top left/1px var(--l),linear-gradient(var(--c),var(--c)) top right/var(--l) 1px,linear-gradient(var(--c),var(--c)) top right/1px var(--l),linear-gradient(var(--c),var(--c)) bottom left/var(--l) 1px,linear-gradient(var(--c),var(--c)) bottom left/1px var(--l),linear-gradient(var(--c),var(--c)) bottom right/var(--l) 1px,linear-gradient(var(--c),var(--c)) bottom right/1px var(--l);background-repeat:no-repeat}
.scr.editing .it::after{opacity:1}
.scr.editing .it.sel::after{--c:var(--acc);--l:9px}
.clock{display:block;text-align:center;pointer-events:auto;color:var(--fg);text-shadow:var(--tsh)}
.clock .t{font-variant-numeric:tabular-nums;line-height:.95;white-space:nowrap;letter-spacing:-.5px}
.clock .d{font-size:12px;letter-spacing:2.2px;text-transform:uppercase;font-weight:450;color:var(--fg2);margin-top:8px;white-space:nowrap}
.clock.bgv{padding:14px 20px 16px;border-radius:26px}
.rh{position:absolute;right:-16px;bottom:-16px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:none;place-items:center;font-size:11px;font-weight:700;cursor:nwse-resize;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.scr.editing .it.sel .rh{display:grid}
.lens{width:var(--sz);height:var(--sz);border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fg),0 0 6px rgba(0,0,0,.18);transition:transform calc(110ms*var(--k)) cubic-bezier(.3,.7,.3,1.4),opacity calc(90ms*var(--k))}
.lens.dot{background:color-mix(in srgb,var(--fg) 26%,transparent);box-shadow:inset 0 0 0 1px var(--fg2)}
.lens.bar{height:7px;width:calc(var(--sz)*1.1);border-radius:4px;background:var(--fg);box-shadow:none;opacity:.85}
.lens.press{transform:scale(.9)}
.lens.held{transform:scale(.86)}
.lens.gone{opacity:0}
.lzone{position:absolute;border-radius:20px;outline:1px dashed rgba(255,90,90,.85);pointer-events:none;display:none}
.scr.zones .lzone{display:block}

/* Guides / grid (only while dragging) */
.guides{position:absolute;inset:0;pointer-events:none;z-index:35}
.guides svg{position:absolute;inset:0;width:360px;height:797px}

/* Material + origin edge */
.mat{position:absolute;background:var(--m-fill);backdrop-filter:var(--m-blur);-webkit-backdrop-filter:var(--m-blur);box-shadow:var(--m-shadow);color:var(--fg)}
.mat::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:radial-gradient(150px 110px at var(--ox,50%) var(--oy,0%),var(--edge-hot),var(--edge-cold) 72%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.mat::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(240px 150px at var(--ox,50%) var(--oy,0%),var(--inner),transparent 72%)}
.mat>*{position:relative;z-index:1}
.scr[data-mat="clear"] .mat.cl{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.scr[data-mat="clear"] .mat.cl::before,.scr[data-mat="clear"] .mat.cl::after{display:none}
.scr[data-mat="clear"] .mat.cl .row{text-shadow:var(--tsh)}

/* Edit controls */
.etop{position:absolute;inset:0;pointer-events:none;z-index:55}
.etop>*{pointer-events:auto;opacity:0;transform:translateY(-10px);transition:opacity calc(200ms*var(--k)),transform calc(240ms*var(--k)) cubic-bezier(.2,.9,.3,1.1)}
.scr.editing .etop>*{opacity:1;transform:none}
.scr:not(.editing) .etop>*{pointer-events:none}
.pill{height:36px;border-radius:18px;padding:0 13px;display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:550;border:0;cursor:pointer}
.etop .mini,.etop #bMode{position:relative}
.pill{white-space:nowrap}
.pill .dt{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.pill .cv{opacity:.6;font-size:10px}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;padding:0}
.circ svg{width:20px;height:20px}
.circ.ok{background:var(--acc);color:var(--acc-ink);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.circ.ok::before,.circ.ok::after{display:none}
.mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;padding:0}
.mini svg{width:18px;height:18px}
.mini[disabled]{opacity:.4;cursor:default}
.scr button{color:inherit;font-family:inherit}
.scr button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Popover / inspector */
.pop{width:312px;border-radius:22px;z-index:58;padding:14px 14px 12px;transform-origin:var(--ox,50%) var(--oy,0%);transition:opacity calc(160ms*var(--k)),transform calc(220ms*var(--k)) cubic-bezier(.2,.9,.3,1.06)}
.pop.in{opacity:0;transform:scale(.86)}
.pop .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pop .hd b{font-size:15px;font-weight:600;font-variation-settings:"wdth" 108;display:block}
.pop .hd small{font-size:12px;color:var(--fg2)}
.pop .hd .x{margin-left:auto}
.scroll{max-height:330px;overflow:auto;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.row{display:flex;align-items:center;gap:10px;min-height:42px;border-top:1px solid var(--line);font-size:13.5px}
.row:first-child{border-top:0}
.row>span:first-child{flex:none;width:86px;color:var(--fg2);font-size:12.5px}
.row .grow{flex:1;min-width:0;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:2px;border-radius:12px;background:color-mix(in srgb,var(--fg) 8%,transparent)}
.seg button{border:0;background:none;font-size:12px;padding:6px 8px;border-radius:10px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);font-weight:600}
.lnk{border:0;background:color-mix(in srgb,var(--fg) 8%,transparent);font-size:12.5px;padding:7px 10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.lnk.acc{background:var(--acc);color:var(--acc-ink);font-weight:600}
.lnk.warn{color:#ff9a8a}
.scr[data-wall="light"] .lnk.warn{color:#b3261e}
.lnk[disabled]{opacity:.45;cursor:default}
input[type=range].sl{flex:1;min-width:0;accent-color:var(--acc);height:20px}
output{font-family:var(--f-mono);font-size:11px;color:var(--fg2);width:40px;text-align:right}
.txt{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--fg);background:color-mix(in srgb,var(--fg) 8%,transparent);border:0;border-radius:10px;padding:7px 9px}
.tg{width:38px;height:22px;border-radius:11px;border:0;background:color-mix(in srgb,var(--fg) 20%,transparent);position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:left .15s}
.tg[aria-pressed="true"]{background:var(--acc)}
.tg[aria-pressed="true"]::after{left:19px;background:var(--acc-ink)}
.applist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px;padding:4px 0}
.applist button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer;padding:4px 0;border-radius:12px}
.applist button[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.hint{font-size:12px;color:var(--fg2);line-height:1.45;margin:6px 0 2px}
.plus{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 1.5px var(--acc);display:grid;place-items:center;color:var(--acc);font-size:22px;font-weight:300;z-index:36;pointer-events:none}

/* Studio sheet */
.studio{left:12px;right:12px;top:44px;border-radius:24px;z-index:59;padding:16px 16px 14px;max-height:640px;overflow:auto;transform-origin:94% 0;transition:opacity calc(170ms*var(--k)),transform calc(240ms*var(--k)) cubic-bezier(.2,.9,.3,1.05)}
.studio.in{opacity:0;transform:scale(.9)}
.studio h3{margin:0 0 2px;font-size:22px;font-weight:500;font-variation-settings:"wdth" 112}
.studio .sub{font-size:12.5px;color:var(--fg2);margin-bottom:8px}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.srow:first-of-type{border-top:0}
.srow .g{width:34px;height:34px;border-radius:11px;box-shadow:inset 0 0 0 1px var(--fg3);display:grid;place-items:center;flex:none;color:var(--fg2)}
.srow .g svg{width:17px;height:17px}
.srow b{display:block;font-size:15px;font-weight:550}
.srow small{display:block;font-size:12.5px;color:var(--fg2);margin-top:1px}
.srow .ch{margin-left:auto;color:var(--fg3)}

/* Confirm */
.conf{left:24px;right:24px;top:150px;border-radius:22px;z-index:62;padding:16px;--oy:0%}
.conf b{font-size:15px;display:block;margin-bottom:4px}
.conf p{margin:0 0 12px;font-size:13px;color:var(--fg2);line-height:1.45}
.conf .btns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* Search */
.search{position:absolute;inset:0;pointer-events:none;z-index:50}
.scr.searching .search{pointer-events:auto}
.morph{position:absolute;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0;overflow:hidden;opacity:0;
  transition:left calc(170ms*var(--k)) cubic-bezier(.2,.9,.25,1),top calc(220ms*var(--k)) cubic-bezier(.2,.8,.2,1),width calc(170ms*var(--k)) cubic-bezier(.2,.9,.25,1),height calc(170ms*var(--k)) cubic-bezier(.2,.9,.25,1),box-shadow calc(140ms*var(--k)),background calc(140ms*var(--k))}
.morph.ring{opacity:1;background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg);backdrop-filter:none}

/* ───── templates ───── */
function tpl(name){

    cell('b1','maps',57,531),cell('b2','music',139,531),cell('b3','mail',221,531),cell('b4','cal',303,531)]};

const PRESETS=[['pure','Pure','LENS a hodiny'],['essentials','Essentials','4 aplikace kolem LENS'],['balanced','Balanced','hodiny vlevo, řada aplikací']];

function forbidden(exceptId){const f=[lensZone()];const c=exceptId==='clock'?null:clockRect();if(c)f.push(c);const d=home.querySelector('[data-id="date"]');if(d&&exceptId!=='date')f.push(domRect(d));return f;}
function validAt(it,p){const r=itemRect(it,p);if(r.t<SAFE_T||r.b>SAFE_B-40||r.l<8||r.r>352)return false;return !forbidden(it.id).some(f=>hit(f,r));}

const DAYS=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'],MON=['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];

function undo(){if(!S.hist.length)return;S.fut.push(JSON.stringify(S.layout));S.layout=JSON.parse(S.hist.pop());afterHist('Zpět o krok');}

/* ───── log / toast ───── */

/* ───── pointer ───── */
function pt(e){const r=scr.getBoundingClientRect(),k=r.width/W;return {x:(e.clientX-r.left)/k,y:(e.clientY-r.top)/k};}
let P=null;
scr.addEventListener('pointerdown',e=>{
  if(e.target.closest('#pop,#studio,#conf,#etop,#kb,#res,#morph'))return;
  if(S.mode==='search'){closeSearch();return;}
  if(S.popKind||!studio.hidden){closePop();closeStudio();if(S.mode==='edit')return;}
  const p=pt(e);
  if(e.target.closest('#pz')){ if(S.mode==='edit')openPulse(); else {log('PULSE: klepnutí patří do fáze B4 (Quick View z kamery)');} return;}
  const el=e.target.closest('[data-id]');const id=el?el.dataset.id:null;
  scr.setPointerCapture(e.pointerId);

  if(S.mode==='home'){
    if(id==='lens'){ const lens=$('#lensEl');lens&&lens.classList.add('press');
      if(L().hold==='arc')P.timer=setTimeout(()=>{if(P&&!P.moved)openArc();},T(L().delay)||1); }
    else P.timer=setTimeout(()=>{ if(!P||P.moved)return; enterEdit(); log('Dlouhý stisk → Upravit plochu','LONG_PRESS'); if(id&&id!=='clock'){ S.sel=id; render(); startDrag(p);} },450);
  }else if(S.mode==='edit'&&P.resize){pushHist();P.size0=item('clock').size;}
});
scr.addEventListener('pointermove',e=>{
  if(!P)return;const p=pt(e);const d=Math.hypot(p.x-P.sx,p.y-P.sy);
  if(P.arc){arcMove(p);return;}
  if(P.resize){const it=item('clock');it.size=clamp(Math.round(P.size0+(p.x-P.sx)*.7+(p.y-P.sy)*.7),40,140);render();return;}
  if(!P.moved&&d>8){P.moved=true;clearTimeout(P.timer);
    if(S.mode==='home'&&P.id==='lens'){const lens=$('#lensEl');lens&&lens.classList.remove('press');if(p.y<P.sy-20)log('Swipe nahoru z LENS → šuplík (beze změny)');}
    if(S.mode==='edit'&&P.id&&!P.drag){S.sel=P.id;render();startDrag(p);}
  }
  if(P.drag)dragMove(p);
});
scr.addEventListener('pointerup',e=>{
  if(!P)return;clearTimeout(P.timer);const p=pt(e);const cur=P;P=null;
  const lens=$('#lensEl');lens&&lens.classList.remove('press');
  if(cur.arc){arcRelease();return;}
  if(cur.drag){dragEnd();return;}
  if(cur.resize){render();openInspector('clock');return;}
  if(cur.moved)return;
  if(S.mode==='home'){
    if(cur.id==='lens')lensTap();
    else if(cur.id&&cur.id!=='clock'){const it=item(cur.id);log('Spustit: '+(it.k==='flow'?'FLOW '+it.name+' (náhled)':APPS[it.app].n),'CONFIRM');}
  }else if(S.mode==='edit'){
    if(cur.id)openInspector(cur.id);else openAdd(p);
  }
});

/* ───── drag ───── */
let D=null;
function startDrag(p){
  const it=item(S.sel);if(!it)return;closePop();pushHist();
  const ps=pos(it);D={it,ox:ps.x-p.x,oy:ps.y-p.y,from:{band:it.band,x:ps.x,y:ps.y},target:null};
  P&&(P.drag=true,P.moved=true);
  const el=home.querySelector(`[data-id="${it.id}"]`);el&&el.classList.add('drag');log('Přesun: '+label(it),'DRAG_START');
}
function label(it){return it.k==='app'?(it.labelText||APPS[it.app].n):it.k==='flow'?'FLOW '+it.name:it.k==='lens'?'LENS':it.k==='clock'?'Hodiny':'Datum';}
function dragMove(p){
  const it=D.it,raw={x:p.x+D.ox,y:p.y+D.oy};const el=home.querySelector(`[data-id="${it.id}"]`);
  if(it.k==='lens'){const x=clamp(raw.x,60,300),y=clamp(raw.y,600,745);const sx=Math.abs(x-180)<6?180:x;D.target={x:sx,y};el.style.left=sx+'px';el.style.top=y+'px';drawGuides({guides:sx===180?[{x:180}]:[]});drawGhostArc({x:sx,y});return;}
  if(it.k==='clock'||it.k==='date'){const t=resolveFree(it,raw);D.target=t;el.style.left=(it.k==='clock'?t.x+(clockAnchorDx(it)):t.x)+'px';el.style.top=t.y+'px';drawGuides(t);return;}
  el.style.left=raw.x+'px';el.style.top=(raw.y+(it.label?9:0))+'px';
  D.target=resolve(it,raw);drawGuides(D.target);
}
function clockAnchorDx(){return 0;}
function resolveFree(it,raw){
  const g=[];let x=clamp(raw.x,20,340),y=clamp(raw.y,SAFE_T+30,560);
  for(const cx of [180,28,332]){if(Math.abs(x-cx)<6){x=cx;g.push({x:cx});}}
  return {x,y,guides:g};
}
function resolve(it,raw){
  const ly=S.layout,others=ly.items.filter(o=>o!==it&&(o.k==='app'||o.k==='flow'));let t;
  if(raw.y>L().y-46){ // LENS row
    const l=L();let best=null;for(const b of [-2,-1,1,2]){const x=clamp(l.x+BAND[b],24,336);const dd=Math.abs(raw.x-x);if(!best||dd<best.d)best={b,x,d:dd};}
    t={band:best.b,x:best.x,y:l.y,guides:[],row:true};
  }else if(ly.placement==='grid'){t=nearestCell(it,raw,others)||{x:raw.x,y:raw.y};t.grid=true;t.guides=[];}
  else{
    let x=raw.x,y=raw.y;const g=[];
    if(ly.placement==='hybrid'){const c=cells().find(c=>Math.hypot(c.x-x,c.y-y)<12);if(c){x=c.x;y=c.y;}}
    if(ly.snap){for(const o of others){const op=pos(o);if(Math.abs(op.x-x)<5){x=op.x;g.push({x});}if(Math.abs(op.y-y)<5){y=op.y;g.push({y});}}
      if(Math.abs(x-180)<5){x=180;g.push({x:180});}}
    x=clamp(x,8+it.size/2+4,352-it.size/2-4);y=clamp(y,SAFE_T+it.size/2+4,SAFE_B-60);
    if(!validAt(it,{x,y})){const c=nearestCell(it,{x,y},others,true);if(c){x=c.x;y=c.y;}}
    t={x,y,guides:g,grid:ly.placement==='hybrid'};
  }
  // collision with another icon → preview where it moves
  const tr=itemRect(it,{x:t.x,y:t.y});const victim=others.find(o=>{if(t.band!=null&&o.band===t.band)return true;return o.band==null&&t.band==null&&hit(itemRect(o),tr);});
  if(victim){
    let to=null;
    if(D.from.band!=null&&t.band!=null)to={band:D.from.band};
    else if(D.from.band==null&&t.band==null&&D.from.x!=null)to={x:D.from.x,y:D.from.y};
    else{const c=nearestCell(victim,pos(victim),others.filter(o=>o!==victim).concat([{...it,band:t.band,x:t.x,y:t.y}]),true);to=c?{x:c.x,y:c.y}:null;}
    if(to&&to.band==null&&to.x!=null&&D.from.band!=null&&t.band==null)to={band:D.from.band};
    t.victim=victim;t.to=to;
  }
  return t;
}
function nearestCell(it,p,others,skipOcc){
  const occ=c=>others.some(o=>{const op=pos(o);return o.band==null&&Math.hypot(op.x-c.x,op.y-c.y)<20;});
  let best=null;for(const c of cells()){if(!validAt(it,c))continue;if(skipOcc&&occ(c))continue;const d=Math.hypot(c.x-p.x,c.y-p.y);if(!best||d<best.d)best={...c,d};}
  return best;
}
function drawGuides(t){
  if(!t){guides.innerHTML='';return;}
  let s='<svg viewBox="0 0 360 797">';
  // safe bands
  s+=`<rect x="0" y="0" width="360" height="${SAFE_T}" fill="var(--fg)" opacity=".05"/><rect x="0" y="${SAFE_B}" width="360" height="${H-SAFE_B}" fill="var(--fg)" opacity=".05"/>`;
  if(D&&D.it.k!=='lens'){const z=lensZone();s+=`<rect x="${z.l}" y="${z.t}" width="${LZ.w}" height="${LZ.h}" rx="20" fill="none" stroke="var(--fg3)" stroke-dasharray="3 4"/>`;}
  if(t.grid&&D&&D.it.k!=='lens'){for(const c of cells())if(validAt(D.it,c))s+=`<circle cx="${c.x}" cy="${c.y}" r="1.6" fill="var(--fg)" opacity=".45"/>`;}
  if(t.row){const l=L();for(const b of [-2,-1,1,2])s+=`<circle cx="${clamp(l.x+BAND[b],24,336)}" cy="${l.y}" r="23" fill="none" stroke="var(--fg3)" stroke-dasharray="2 4"/>`;}
  for(const g of (t.guides||[]))s+=g.x!=null?`<line x1="${g.x}" y1="40" x2="${g.x}" y2="780" stroke="var(--acc)" stroke-width="1" opacity=".7"/>`:`<line x1="0" y1="${g.y}" x2="360" y2="${g.y}" stroke="var(--acc)" stroke-width="1" opacity=".7"/>`;
  if(D&&D.it.k!=='lens'&&D.it.k!=='clock'&&D.it.k!=='date'){s+=`<circle cx="${t.x}" cy="${t.y}" r="${D.it.size/2+3}" fill="none" stroke="var(--acc)" stroke-width="1.5"/>`;}
  if(t.victim&&t.to){const vp=pos(t.victim);const tp=t.to.band!=null?{x:clamp(L().x+BAND[t.to.band],24,336),y:L().y}:t.to;
    s+=`<circle cx="${tp.x}" cy="${tp.y}" r="${t.victim.size/2+3}" fill="none" stroke="var(--fg2)" stroke-dasharray="3 3"/><line x1="${vp.x}" y1="${vp.y}" x2="${tp.x}" y2="${tp.y}" stroke="var(--fg3)" stroke-dasharray="2 4"/>`;}
  guides.innerHTML=s+'</svg>';
}
function dragEnd(){
  const it=D.it,t=D.target;guides.innerHTML='';ghostArc.innerHTML='';
  if(t){
    if(it.k==='lens'||it.k==='clock'||it.k==='date'){it.x=Math.round(t.x);it.y=Math.round(t.y);if(it.k==='clock')it.align='center';}
    else{ if(t.band!=null){it.band=t.band;delete it.x;delete it.y;it.label=false;} else {it.band=null;delete it.band;it.x=Math.round(t.x);it.y=Math.round(t.y);}
      if(t.victim&&t.to){const v=t.victim;if(t.to.band!=null){v.band=t.to.band;delete v.x;delete v.y;v.label=false;}else{delete v.band;v.x=Math.round(t.to.x);v.y=Math.round(t.to.y);v.label=true;}log(label(v)+' uhnula na volné místo');}
      if(t.band==null&&it.label===false&&D.from.band!=null)it.label=true;
    }
    log('Položeno: '+label(it)+(t.band!=null?' · řada LENS':t.grid?' · buňka mřížky':' · volně'),'CONFIRM');
  }
  D=null;render();
}

  const above=anchor.t-12-hEst>SAFE_T+44;let top=above?anchor.t-12-hEst:anchor.b+12;
  top=clamp(top,SAFE_T+44,H-24-hEst);
  pop.style.left=left+'px';pop.style.top=top+'px';
  pop.style.setProperty('--ox',((cx-left)/w*100)+'%');pop.style.setProperty('--oy',above?'100%':'0%');
}

/* ───── ARC ───── */
function arcGeom(l){
  // base angles 150…30°, rotated so every slot stays ≥ 26 dp from the screen edge
  const R=118;let best=0;
  for(let s=0;s<=60;s+=5){for(const sg of [1,-1]){const sh=s*sg;const ok=[150,120,90,60,30].every(a=>{const x=l.x+R*Math.cos((a+sh)*Math.PI/180);return x>=26&&x<=334;});if(ok){best=sh;s=999;break;}}}
  return {R,angles:[150,120,90,60,30].map(a=>a+best),shift:best};
}
function arcSVG(l,sel,ghost){
  const g=arcGeom(l),R=g.R,a0=(172+g.shift)*Math.PI/180,a1=(8+g.shift)*Math.PI/180;
  const P=a=>[l.x+R*Math.cos(a),l.y-R*Math.sin(a)];const [x0,y0]=P(a0),[x1,y1]=P(a1);
  let s=`<svg viewBox="0 0 360 797"><defs><linearGradient id="af${ghost?'g':''}" x1="${x0}" y1="0" x2="${x1}" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--fg)" stop-opacity="0"/><stop offset=".18" stop-color="var(--fg)" stop-opacity=".26"/><stop offset=".82" stop-color="var(--fg)" stop-opacity=".26"/><stop offset="1" stop-color="var(--fg)" stop-opacity="0"/></linearGradient></defs>`;
  s+=`<path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1}" fill="none" stroke="url(#af${ghost?'g':''})" stroke-width="1" ${ghost?'stroke-dasharray="3 4"':''}/>`;
  if(sel!=null&&!ghost){const a=g.angles[sel]*Math.PI/180,da=.32;const [sx,sy]=P(a+da),[ex,ey]=P(a-da);s+=`<path d="M${sx} ${sy} A${R} ${R} 0 0 1 ${ex} ${ey}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" opacity=".9"/>`;
    const [dx,dy]=[l.x+(R-30)*Math.cos(a),l.y-(R-30)*Math.sin(a)];s+=`<circle cx="${dx}" cy="${dy}" r="2.5" fill="var(--acc)"/>`;}
  if(ghost)g.angles.forEach(a=>{const [x,y]=P(a*Math.PI/180);s+=`<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="var(--fg2)"/>`;});
  return s+'</svg>';
}
function drawGhostArc(l){ghostArc.innerHTML=arcSVG(l,null,true);}
let A=null;
function openArc(){
  if(!P)return;P.arc=true;A={sel:null};S.mode='arc';scr.classList.add('arcing');const lens=$('#lensEl');lens&&(lens.classList.remove('press'),lens.classList.add('held'));
  drawArc();arcEl.classList.add('on');log('ARC otevřen','LONG_PRESS');
}
function drawArc(){
  const l=L(),g=arcGeom(l);let h=arcSVG(l,A.sel);
  ARCSET.forEach((s,i)=>{const a=g.angles[i]*Math.PI/180,o=A.sel===i?3:0;const x=l.x+(g.R+o)*Math.cos(a),y=l.y-(g.R+o)*Math.sin(a);
    h+=`<div class="slot ${A.sel===i?'sel':''}" style="left:${x}px;top:${y}px">${s.t==='app'?iconHTML(s.a,null,40):`<span class="ico veil" style="--sz:40px;font-size:11px;font-weight:600">${s.f}</span>`}</div>`;});
  if(A.sel!=null){const s=ARCSET[A.sel];h+=`<div class="arcName" style="left:${clamp(l.x,70,290)}px;top:${l.y-g.R-64}px">${s.t==='app'?APPS[s.a].n:'FLOW '+s.f}</div>`;}
  arcEl.innerHTML=h;
}
function arcMove(p){
  const l=L(),dx=p.x-l.x,dy=l.y-p.y,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI,g=arcGeom(l);let sel=null;
  if(d>=70&&d<=200){g.angles.forEach((a,i)=>{if(Math.abs(ang-a)<=15)sel=i;});}
  else if(d>=40&&A.sel!=null&&d<70)sel=A.sel;
  if(sel!==A.sel){A.sel=sel;drawArc();if(sel!=null)log('Vybráno: '+(ARCSET[sel].t==='app'?APPS[ARCSET[sel].a].n:'FLOW '+ARCSET[sel].f),'CLOCK_TICK');}
}
function arcRelease(){const s=A&&A.sel!=null?ARCSET[A.sel]:null;closeArc();if(s){toast('Spuštěno: '+(s.t==='app'?APPS[s.a].n:'FLOW '+s.f));log('Puštěno na místě → Action engine','CONFIRM');}else log('Puštěno mimo místa → zrušeno, nic se nespustí');}
function closeArc(){arcEl.classList.remove('on');scr.classList.remove('arcing');S.mode='home';A=null;const lens=$('#lensEl');lens&&lens.classList.remove('held');setTimeout(()=>{if(!A)arcEl.innerHTML='';},T(80)+20);}

/* ───── LENS → Search ───── */
const KB_H=276,FIELD_H=48;
function lensTap(){const l=L();if(l.tap==='search')openSearch();else if(l.tap==='drawer'){log('Klepnutí na LENS → šuplík (nastaveno v LENS editoru)');toast('Šuplík');}else{log('Klepnutí na LENS → náhled FLOW pocty');toast('FLOW pocty · náhled');}}
async function openSearch(){
  if(S.mode!=='home')return;S.mode='search';const l=L(),d=l.style==='bar'?l.size*1.1:l.size,hgt=l.style==='bar'?7:l.size;
  const lens=$('#lensEl');
  morph.style.transition='none';morph.className='morph ring';
  Object.assign(morph.style,{left:(l.x-d/2)+'px',top:(l.y-hgt/2)+'px',width:d+'px',height:hgt+'px'});
  void morph.offsetWidth;morph.style.transition='';
  lens&&lens.classList.add('press');log('LENS stisk 0 ms','VIRTUAL_KEY');
  await wait(70);
  lens&&lens.classList.add('gone');scr.classList.add('searching');
  const fw=W-32;morph.className='morph mat field';morph.style.setProperty('--ox',((l.x-16)/fw*100)+'%');
  Object.assign(morph.style,{left:'16px',width:fw+'px',height:FIELD_H+'px',top:(l.y-FIELD_H/2)+'px'});
  log('Obrys se rozvine do pole · 170 ms');
  await wait(110);
  kb.classList.add('up');morph.style.top=(H-KB_H-8-FIELD_H)+'px';log('IME + pole jedou spolu (WindowInsets.ime) · 220 ms');
  q.value='';q.focus({preventScroll:true});
  await wait(200);
  renderResults(true);
}
async function closeSearch(instant){
  if(S.mode!=='search')return;const l=L(),d=l.style==='bar'?l.size*1.1:l.size,hgt=l.style==='bar'?7:l.size;
  res.classList.remove('on');q.blur();
  if(!instant)await wait(90);
  kb.classList.remove('up');morph.style.top=(l.y-FIELD_H/2)+'px';
  if(!instant)await wait(200);
  morph.className='morph ring';Object.assign(morph.style,{left:(l.x-d/2)+'px',top:(l.y-hgt/2)+'px',width:d+'px',height:hgt+'px'});
  scr.classList.remove('searching');
  if(!instant)await wait(160);
  const lens=$('#lensEl');lens&&lens.classList.remove('gone','press');morph.className='morph';res.innerHTML='';S.mode='home';
  if(!instant)log('Zpět: výsledky → klávesnice → pole se stáhne do LENS');
}
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function renderResults(stagger){
  const v=norm(q.value.trim());let h='';let first=null;
  const fl=v&&FLOWS.find(f=>f.name===v);
  let apps=Object.keys(APPS);
  if(v)apps=apps.filter(k=>norm(APPS[k].n).includes(v)).sort((a,b)=>norm(APPS[a].n).startsWith(v)?-1:norm(APPS[b].n).startsWith(v)?1:0);
  else apps=['maps','music','msg','web'];
  apps=apps.slice(0,5);
  let i=0;
  if(fl){h+=`<div class="flowc r first" style="transition-delay:0ms"><div style="display:flex;align-items:center;gap:8px"><span class="nm">${fl.name}</span><small style="margin-left:auto;color:var(--fg2);font-size:11.5px">FLOW · ${fl.apps.length} aplikace</small></div><div style="display:flex;align-items:center;gap:8px"><div class="chain">${fl.apps.map((a,j)=>`${j?'<span class="ln"></span>':''}<span class="st"><span class="no">${j+1}</span>${iconHTML(a,null,28)}</span>`).join('')}</div><button class="lnk acc" style="margin-left:auto" data-run="1">Spustit</button></div></div>`;first='FLOW '+fl.name;i++;}
  apps.forEach(k=>{h+=`<div class="r ${!first&&i===0?'first':''}" data-app="${k}" style="transition-delay:${stagger?i*18:0}ms">${iconHTML(k,null,36)}<span>${APPS[k].n}</span>${!first&&i===0?'<small>Enter</small>':''}</div>`;if(!first)first=APPS[k].n;i++;});
  if(!v)h+=`<div class="cap">Nedávné</div>`;
  if(!apps.length&&!fl)h=`<div class="r" style="opacity:1;transform:none;color:var(--fg2)">Nic nenalezeno pro „${esc(q.value)}“</div>`;
  res.innerHTML=h;res.style.bottom=(KB_H+8+FIELD_H+8)+'px';res.dataset.first=first||'';
  res.classList.remove('on');void res.offsetWidth;res.classList.add('on');
}
q.addEventListener('input',()=>renderResults(false));
q.addEventListener('keydown',e=>{if(e.key==='Enter'){runFirst();e.preventDefault();}if(e.key==='Escape')closeSearch();});
function runFirst(){const f=res.dataset.first;if(f){toast('Spuštěno: '+f);log('Enter → '+f,'CONFIRM');closeSearch();}}
res.addEventListener('click',e=>{const r=e.target.closest('[data-app],[data-run]');if(!r)return;const n=r.dataset.app?APPS[r.dataset.app].n:res.dataset.first;toast('Spuštěno: '+n);log('Klepnutí → '+n,'CONFIRM');closeSearch();});
(function buildKb(){const rows=['qwertzuiop','asdfghjkl','yxcvbnm'];let h='';rows.forEach((r,i)=>{h+='<div class="kr">'+(i===2?'<button class="m" data-key="shift" aria-label="Shift">⇧</button>':'')+[...r].map(c=>`<button data-key="${c}">${c}</button>`).join('')+(i===2?'<button class="m" data-key="bs" aria-label="Smazat">⌫</button>':'')+'</div>';});

  kb.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-key]');if(!b)return;e.preventDefault();const k=b.dataset.key;if(k==='bs')q.value=q.value.slice(0,-1);else if(k==='enter'){runFirst();return;}else if(k.length===1)q.value+=k;renderResults(false);});})();

/* ───── scenes + notes ───── */
const NOTES={

 edit:['Upravit plochu','<p>Plocha se nemění v jinou obrazovku. Tapeta se o 7 % oddálí (<code>WallpaperManager.setWallpaperZoomOut</code>) a ztlumí, prvky zůstanou na místě a dostanou čtyři vlasové rohové značky. Shora sjedou jen čtyři malé ovladače: předloha, Zpět/Znovu, režim rozložení, Studio a ✓.</p><p>Klepnutí na prvek = inspektor u prvku. Klepnutí na prázdné místo = přidat sem. Systémové Zpět s neuloženými změnami se zeptá.</p>'],

 clock:['Detail hodin','<p>Inspektor vyroste z hodin a hrana svítí na straně, kde jsou. Písmo, velikost, tloušťka a šířka (osy Roboto Flex), barva, krytí, formát, datum (pod hodinami / samostatně / skryté), zarovnání a volitelné pozadí Veil. Kolečko ⤡ mění velikost přímo na ploše.</p>'],
 icon:['Detail ikony','<p>Jedna nabídka u prvku: změnit aplikaci, ikonu (výchozí / systém / mono / Veil), velikost, popisek, akci při klepnutí, jemný posun po 4 dp a odebrat z plochy (aplikace zůstává nainstalovaná). Mazání neexistuje.</p>'],

let curScene='home';

  if(S.mat==='frosted')extra=S.p3?'<p><b>Frosted na Phone (3):</b> <code>ro.surface_flinger.supports_background_blur = 0</code> a tapeta je živá (Nothing Atmosphere). Systém neumí rozostřit tapetu za oknem a launcher ji nemůže přečíst jako obrázek. Rozostří se jen vlastní vrstvy Intelie (při hledání hodiny a ikony), panel je hustší Veil.</p>':'<p><b>Frosted s blur za oknem</b> (zařízení, která ho mají): skutečné rozostření pod panelem. Fallback na Veil při úsporném režimu, přehřátí nebo vypnutém blur.</p>';
  noteEl.innerHTML=`<h3>${n[0]}</h3>${n[1]}${extra}`;

function typeDemo(w){let i=0;const t=setInterval(()=>{if(S.mode!=='search'){clearInterval(t);return;}q.value=w.slice(0,++i);renderResults(false);if(i>=w.length)clearInterval(t);},S.rm?1:120);}
async function demoMove(){
  let it=S.layout.items.find(i=>i.k==='app'&&i.band===2)||S.layout.items.find(i=>i.k==='app');if(!it)return;
  S.sel=it.id;render();const a=pos(it),b={x:303,y:426};
  P={id:it.id,sx:a.x,sy:a.y,moved:true};startDrag(a);
  const n=S.rm?1:36;for(let i=1;i<=n;i++){const t=i/n,e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;dragMove({x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e-Math.sin(t*Math.PI)*30});await new Promise(r=>setTimeout(r,S.rm?0:22));}

}
async function demoArc(){
